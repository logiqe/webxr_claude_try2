<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ocean VR - Immersive Underwater Experience</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #001133; overflow: hidden; font-family: Arial, sans-serif; }
  canvas { display: block; }
  #vr-button {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    padding: 14px 32px; background: rgba(0,120,255,0.85); color: #fff;
    border: 2px solid rgba(100,200,255,0.7); border-radius: 30px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    backdrop-filter: blur(8px); letter-spacing: 1px;
    transition: background 0.3s, box-shadow 0.3s;
    box-shadow: 0 0 20px rgba(0,150,255,0.5);
    z-index: 100;
  }
  #vr-button:hover { background: rgba(0,160,255,0.95); box-shadow: 0 0 35px rgba(0,180,255,0.8); }
  #vr-button.hidden { display: none; }
  #info {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    color: rgba(180,230,255,0.85); font-size: 13px; text-align: center;
    text-shadow: 0 0 10px rgba(0,100,255,0.8); pointer-events: none; z-index: 100;
    letter-spacing: 0.5px;
  }
  #loading {
    position: fixed; inset: 0; background: #000d1a;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; z-index: 200; transition: opacity 1s;
  }
  #loading h2 { color: #4af; font-size: 28px; margin-bottom: 16px; letter-spacing: 3px; }
  #loading p { color: #6bf; font-size: 14px; opacity: 0.7; }
  .wave-anim { animation: wave 2s infinite ease-in-out; }
  @keyframes wave { 0%,100%{opacity:0.6} 50%{opacity:1} }
</style>
</head>
<body>
<div id="loading">
  <h2 class="wave-anim">🌊 OCEAN VR</h2>
  <p>Initialisation de l\'environnement sous-marin...</p>
</div>
<div id="info">🐟 Environnement Océan Immersif — Utilisez la souris pour regarder autour</div>
<button id="vr-button" class="hidden">🥽 Enter VR</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── RENDERER ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// ─── VR BUTTON ──────────────────────────────────────────────────────────────
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(supported => {
    if (supported) {
      const vrBtn = VRButton.createButton(renderer);
      vrBtn.id = 'vr-button-three';
      vrBtn.style.cssText = 'display:none';
      document.body.appendChild(vrBtn);
      const myBtn = document.getElementById('vr-button');
      myBtn.classList.remove('hidden');
      myBtn.addEventListener('click', () => vrBtn.click());
    }
  });
}

// ─── SCENE ──────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x001a3a, 0.018);

// ─── CAMERA ─────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, -4, 8);
camera.lookAt(0, -4, 0);

// OrbitControls for desktop
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 2;
controls.maxDistance = 60;
controls.update();

// ─── LIGHTS ─────────────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x003366, 1.2);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0x88ccff, 1.8);
sunLight.position.set(10, 30, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1024, 1024);
sunLight.shadow.camera.far = 100;
scene.add(sunLight);

const bluePL = new THREE.PointLight(0x0044ff, 3, 40);
bluePL.position.set(0, 0, 0);
scene.add(bluePL);

const causticLight = new THREE.PointLight(0x00aaff, 2, 25);
causticLight.position.set(-5, 2, -5);
scene.add(causticLight);

const deepLight = new THREE.PointLight(0x001166, 2, 50);
deepLight.position.set(0, -20, 0);
scene.add(deepLight);

// ─── SKY ────────────────────────────────────────────────────────────────────
const skyGeo = new THREE.SphereGeometry(200, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { time: { value: 0 } },
  vertexShader: `
    varying vec3 vWorldPos;
    void main() {
      vWorldPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vWorldPos;
    uniform float time;
    void main() {
      float y = normalize(vWorldPos).y;
      vec3 topColor    = vec3(0.0, 0.05, 0.15);
      vec3 horizColor  = vec3(0.0, 0.25, 0.55);
      vec3 deepColor   = vec3(0.0, 0.08, 0.22);
      vec3 col;
      if(y > 0.0) col = mix(horizColor, topColor, y);
      else         col = mix(horizColor, deepColor, -y * 1.5);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

// ─── OCEAN SURFACE ──────────────────────────────────────────────────────────
const oceanGeo = new THREE.PlaneGeometry(200, 200, 128, 128);
const oceanMat = new THREE.ShaderMaterial({
  transparent: true,
  side: THREE.DoubleSide,
  uniforms: {
    time:       { value: 0 },
    deepColor:  { value: new THREE.Color(0x001a3d) },
    shallowColor:{ value: new THREE.Color(0x0055aa) },
    foamColor:  { value: new THREE.Color(0x88ccff) },
  },
  vertexShader: `
    uniform float time;
    varying vec2 vUv;
    varying float vHeight;
    varying vec3 vNormal2;

    float wave(vec2 p, float freq, float speed, float amp, vec2 dir){
      float k = dot(p * freq, dir);
      return sin(k + time * speed) * amp;
    }
    void main(){
      vUv = uv;
      vec3 pos = position;
      float h = 0.0;
      h += wave(pos.xz, 0.18, 1.2, 0.9, vec2(1.0, 0.6));
      h += wave(pos.xz, 0.28, 0.9, 0.5, vec2(-0.8, 1.0));
      h += wave(pos.xz, 0.45, 1.5, 0.3, vec2(0.5, -0.9));
      h += wave(pos.xz, 0.8,  2.0, 0.15,vec2(1.0, 1.0));
      h += wave(pos.xz, 1.2,  1.8, 0.08,vec2(-1.0, 0.5));
      pos.y += h;
      vHeight = h;
      vec3 tangent = normalize(vec3(1.0, wave(pos.xz+vec2(0.01,0.0),0.18,1.2,0.9,vec2(1.0,0.6))-h, 0.0));
      vec3 binorm  = normalize(vec3(0.0, wave(pos.xz+vec2(0.0,0.01),0.18,1.2,0.9,vec2(1.0,0.6))-h, 1.0));
      vNormal2 = normalize(cross(binorm, tangent));
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 deepColor;
    uniform vec3 shallowColor;
    uniform vec3 foamColor;
    uniform float time;
    varying vec2 vUv;
    varying float vHeight;
    varying vec3 vNormal2;
    void main(){
      float t = clamp((vHeight + 1.2) / 2.4, 0.0, 1.0);
      vec3 col = mix(deepColor, shallowColor, t);
      float foam = smoothstep(0.6, 1.0, vHeight);
      col = mix(col, foamColor, foam * 0.6);
      float fresnel = pow(1.0 - abs(dot(vNormal2, vec3(0.0,1.0,0.0))), 3.0);
      col = mix(col, vec3(0.4, 0.7, 1.0), fresnel * 0.4);
      gl_FragColor = vec4(col, 0.82);
    }
  `
});
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
ocean.rotation.x = -Math.PI / 2;
ocean.position.y = 0;
scene.add(ocean);

// ─── OCEAN FLOOR ────────────────────────────────────────────────────────────
const floorGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
const floorMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float time;
    float rand(vec2 n){ return fract(sin(dot(n, vec2(12.9898,4.1414))) * 43758.5453); }
    float noise(vec2 p){
      vec2 ip = floor(p); vec2 fp = fract(p);
      fp = fp*fp*(3.0-2.0*fp);
      return mix(mix(rand(ip),rand(ip+vec2(1,0)),fp.x),mix(rand(ip+vec2(0,1)),rand(ip+vec2(1,1)),fp.x),fp.y);
    }
    void main(){
      float n = noise(vUv * 18.0);
      float caustic = 0.5 + 0.5*sin(vUv.x*30.0+time*0.8)*sin(vUv.y*28.0+time*0.7);
      caustic += 0.3*sin(vUv.x*50.0-time*1.2)*sin(vUv.y*45.0+time*0.9);
      vec3 sand = vec3(0.05, 0.18, 0.35) + n * 0.05;
      sand += vec3(0.0, 0.1, 0.2) * caustic * 0.4;
      gl_FragColor = vec4(sand, 1.0);
    }
  `
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -20;
scene.add(floor);

// ─── UNDERWATER FOG VOLUME ──────────────────────────────────────────────────
const fogGeo = new THREE.BoxGeometry(160, 25, 160);
const fogMat = new THREE.MeshBasicMaterial({
  color: 0x001a3d, transparent: true, opacity: 0.18, side: THREE.BackSide, depthWrite: false
});
const fogVolume = new THREE.Mesh(fogGeo, fogMat);
fogVolume.position.y = -10;
scene.add(fogVolume);

// ─── GOD RAYS ───────────────────────────────────────────────────────────────
function createGodRay(x, z) {
  const h = 22 + Math.random() * 10;
  const geo = new THREE.CylinderGeometry(0.08, 1.8, h, 6, 1, true);
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { time: { value: 0 }, seed: { value: Math.random() * 10 } },
    vertexShader: `
      varying float vY;
      void main(){ vY = position.y; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
    `,
    fragmentShader: `
      uniform float time; uniform float seed;
      varying float vY;
      void main(){
        float fade = smoothstep(-1.0,-0.5,vY) * (1.0-smoothstep(0.3,1.0,vY));
        float flicker = 0.5 + 0.5*sin(time*1.5 + seed*6.28);
        float a = fade * flicker * 0.10;
        gl_FragColor = vec4(0.3,0.7,1.0, a);
      }
    `
  });
  const ray = new THREE.Mesh(geo, mat);
  ray.position.set(x, -h * 0.5 + 1, z);
  ray.userData.mat = mat;
  scene.add(ray);
  return ray;
}
const godRays = [];
for (let i = 0; i < 18; i++) {
  godRays.push(createGodRay((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60));
}

// ─── BUBBLES ────────────────────────────────────────────────────────────────
const BUBBLE_COUNT = 220;
const bubbleGeo = new THREE.SphereGeometry(1, 5, 5);
const bubbleMat = new THREE.MeshPhongMaterial({
  color: 0x88ddff, transparent: true, opacity: 0.35,
  shininess: 120, specular: 0xffffff, wireframe: false
});
const bubblesMesh = new THREE.InstancedMesh(bubbleGeo, bubbleMat, BUBBLE_COUNT);
bubblesMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(bubblesMesh);

const bubbleData = [];
const dummy = new THREE.Object3D();
for (let i = 0; i < BUBBLE_COUNT; i++) {
  bubbleData.push({
    x: (Math.random() - 0.5) * 80,
    y: -18 + Math.random() * 20,
    z: (Math.random() - 0.5) * 80,
    speed: 0.03 + Math.random() * 0.07,
    wobble: Math.random() * Math.PI * 2,
    size: 0.04 + Math.random() * 0.14,
    originY: -18 + Math.random() * 4
  });
}

function updateBubbles(t) {
  for (let i = 0; i < BUBBLE_COUNT; i++) {
    const b = bubbleData[i];
    b.y += b.speed * 0.016;
    if (b.y > 0.2) {
      b.y = b.originY;
      b.x = (Math.random() - 0.5) * 80;
      b.z = (Math.random() - 0.5) * 80;
    }
    const wx = b.x + Math.sin(t * 0.5 + b.wobble) * 0.3;
    const wz = b.z + Math.cos(t * 0.4 + b.wobble) * 0.3;
    dummy.position.set(wx, b.y, wz);
    dummy.scale.setScalar(b.size);
    dummy.updateMatrix();
    bubblesMesh.setMatrixAt(i, dummy.matrix);
  }
  bubblesMesh.instanceMatrix.needsUpdate = true;
}

// ─── CORAL / PLANTS ─────────────────────────────────────────────────────────
function createCoral(x, z) {
  const group = new THREE.Group();
  const colors = [0xff3366, 0xff6600, 0xffaa00, 0x00ffaa, 0xff66cc];
  const col = colors[Math.floor(Math.random() * colors.length)];
  const branches = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < branches; i++) {
    const h = 0.8 + Math.random() * 1.8;
    const r = 0.06 + Math.random() * 0.1;
    const geo = new THREE.CylinderGeometry(r * 0.3, r, h, 5);
    const mat = new THREE.MeshPhongMaterial({ color: col, shininess: 60 });
    const mesh = new THREE.Mesh(geo, mat);
    const angle = (i / branches) * Math.PI * 2;
    const dist = 0.1 + Math.random() * 0.3;
    mesh.position.set(Math.cos(angle) * dist, h / 2, Math.sin(angle) * dist);
    mesh.rotation.z = (Math.random() - 0.5) * 0.6;
    mesh.rotation.x = (Math.random() - 0.5) * 0.3;
    group.add(mesh);
    // tip sphere
    const tipGeo = new THREE.SphereGeometry(r * 0.7, 5, 5);
    const tip = new THREE.Mesh(tipGeo, mat);
    tip.position.copy(mesh.position);
    tip.position.y += h / 2;
    group.add(tip);
  }
  group.position.set(x, -20, z);
  scene.add(group);
  return group;
}
for (let i = 0; i < 45; i++) {
  createCoral((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80);
}

// ─── ROCKS ──────────────────────────────────────────────────────────────────
for (let i = 0; i < 25; i++) {
  const geo = new THREE.DodecahedronGeometry(0.4 + Math.random() * 1.5, 0);
  const mat = new THREE.MeshPhongMaterial({
    color: new THREE.Color(0.1 + Math.random()*0.1, 0.15+Math.random()*0.1, 0.25+Math.random()*0.1),
    shininess: 20
  });
  const rock = new THREE.Mesh(geo, mat);
  rock.position.set((Math.random()-0.5)*70, -20 + Math.random()*0.5, (Math.random()-0.5)*70);
  rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  rock.scale.set(1, 0.6 + Math.random()*0.5, 1);
  scene.add(rock);
}

// ─── FISH SYSTEM ─────────────────────────────────────────────────────────────

// Species 1: Tropical Fish (flattened diamond)
function makeFishGeo_tropical() {
  const geo = new THREE.BufferGeometry();
  const v = new Float32Array([
    0,0,0.7,   0.3,0.1,0,   -0.3,0.1,0,   0,0.3,0,   // top body
    0,0,0.7,   0.3,-0.1,0,  -0.3,-0.1,0,  0,-0.3,0,  // bot body
    0,0,-0.7,  0.3,0.1,0,   -0.3,0.1,0,   0,0.3,0,   // tail top
    0,0,-0.7,  0.3,-0.1,0,  -0.3,-0.1,0,  0,-0.3,0,  // tail bot
  ]);
  const idx = new Uint16Array([
    0,1,3, 0,3,2,
    4,7,5, 4,6,7,
    8,11,9, 8,10,11,
    12,13,15, 12,15,14
  ]);
  geo.setAttribute('position', new THREE.BufferAttribute(v, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  return geo;
}

// Species 2: Elongated fish (needle-like)
function makeFishGeo_needle() {
  const geo = new THREE.CylinderGeometry(0.04, 0.15, 1.4, 6);
  const matrix = new THREE.Matrix4().makeRotationX(Math.PI / 2);
  geo.applyMatrix4(matrix);
  return geo;
}

// Species 3: Round puffer-like
function makeFishGeo_round() {
  const geo = new THREE.SphereGeometry(0.35, 7, 5);
  const m = new THREE.Matrix4().makeScale(1.5, 0.8, 1.0);
  geo.applyMatrix4(m);
  return geo;
}

const fishSpecies = [
  {
    geo: makeFishGeo_tropical(),
    color: [0xff6600, 0xff9900, 0xffcc00, 0xff3300],
    count: 60, scale: 0.5, speed: 0.06, depth: [-8, -4], radius: 30,
    schoolSize: 12
  },
  {
    geo: makeFishGeo_needle(),
    color: [0x0099ff, 0x00ccff, 0x0066cc, 0x66ffcc],
    count: 80, scale: 0.4, speed: 0.09, depth: [-14, -6], radius: 35,
    schoolSize: 20
  },
  {
    geo: makeFishGeo_round(),
    color: [0xff66aa, 0xffaa66, 0xaaff66, 0x66aaff],
    count: 30, scale: 0.6, speed: 0.04, depth: [-18, -8], radius: 25,
    schoolSize: 6
  }
];

class FishSchool {
  constructor(speciesIdx, schoolIdx) {
    const sp = fishSpecies[speciesIdx];
    this.sp = sp;
    this.speciesIdx = speciesIdx;
    this.size = sp.schoolSize;
    const col = sp.color[schoolIdx % sp.color.length];
    const mat = new THREE.MeshPhongMaterial({
      color: col, shininess: 80, specular: 0xffffff,
      emissive: new THREE.Color(col).multiplyScalar(0.08)
    });
    this.mesh = new THREE.InstancedMesh(sp.geo, mat, this.size);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(this.mesh);
    this.dummy = new THREE.Object3D();
    // Boids data
    this.positions  = [];
    this.velocities = [];
    this.center = new THREE.Vector3(
      (Math.random() - 0.5) * sp.radius * 2,
      sp.depth[0] + Math.random() * (sp.depth[1] - sp.depth[0]),
      (Math.random() - 0.5) * sp.radius * 2
    );
    this.swimTime = [];
    for (let i = 0; i < this.size; i++) {
      this.positions.push(new THREE.Vector3(
        this.center.x + (Math.random()-0.5)*4,
        this.center.y + (Math.random()-0.5)*2,
        this.center.z + (Math.random()-0.5)*4
      ));
      const angle = Math.random() * Math.PI * 2;
      this.velocities.push(new THREE.Vector3(
        Math.cos(angle) * sp.speed, (Math.random()-0.5)*0.01, Math.sin(angle)*sp.speed
      ));
      this.swimTime.push(Math.random() * Math.PI * 2);
    }
    this.leaderAngle = Math.random() * Math.PI * 2;
    this.leaderSpeed = sp.speed * (0.8 + Math.random() * 0.4);
    this.leaderY = this.center.y;
    this.leaderYVel = 0;
    this.leaderPos = this.center.clone();
  }

  update(dt, t) {
    // Move leader in smooth circle + vertical drift
    this.leaderAngle += this.leaderSpeed * 0.4 * dt;
    this.leaderYVel += (Math.sin(t * 0.3 + this.speciesIdx) * 0.005 - this.leaderYVel * 0.02);
    this.leaderY = Math.max(this.sp.depth[0], Math.min(this.sp.depth[1], this.leaderY + this.leaderYVel));
    const r = this.sp.radius * (0.4 + 0.3 * Math.sin(t * 0.1));
    this.leaderPos.set(
      Math.cos(this.leaderAngle) * r,
      this.leaderY,
      Math.sin(this.leaderAngle) * r
    );

    for (let i = 0; i < this.size; i++) {
      const pos = this.positions[i];
      const vel = this.velocities[i];
      this.swimTime[i] += dt * 3.5;

      // Boids: separation, alignment, cohesion
      let sep = new THREE.Vector3(), ali = new THREE.Vector3(), coh = new THREE.Vector3();
      let nSep = 0, nAli = 0, nCoh = 0;
      for (let j = 0; j < this.size; j++) {
        if (i === j) continue;
        const d = pos.distanceTo(this.positions[j]);
        if (d < 1.5) {
          sep.add(pos.clone().sub(this.positions[j]).normalize().divideScalar(d));
          nSep++;
        }
        if (d < 4.0) {
          ali.add(this.velocities[j]); nAli++;
          coh.add(this.positions[j]); nCoh++;
        }
      }
      if (nSep > 0) sep.divideScalar(nSep).normalize().multiplyScalar(0.003);
      if (nAli > 0) { ali.divideScalar(nAli); ali.sub(vel).multiplyScalar(0.004); }
      if (nCoh > 0) {
        coh.divideScalar(nCoh);
        coh.sub(pos).normalize().multiplyScalar(0.002);
      }
      // Follow leader
      const toLeader = this.leaderPos.clone().sub(pos);
      const ldist = toLeader.length();
      const leaderForce = toLeader.normalize().multiplyScalar(Math.min(ldist * 0.003, 0.015));

      vel.add(sep).add(ali).add(coh).add(leaderForce);
      // Clamp speed
      const spd = vel.length();
      if (spd > this.sp.speed * 1.5) vel.multiplyScalar((this.sp.speed * 1.5) / spd);
      if (spd < this.sp.speed * 0.3) vel.multiplyScalar((this.sp.speed * 0.3) / spd);

      pos.add(vel.clone().multiplyScalar(60 * dt));

      // Boundary wrap
      if (pos.x >  50) pos.x = -50; if (pos.x < -50) pos.x = 50;
      if (pos.z >  50) pos.z = -50; if (pos.z < -50) pos.z = 50;
      pos.y = Math.max(this.sp.depth[0], Math.min(this.sp.depth[1], pos.y));

      // Orient fish toward velocity
      this.dummy.position.copy(pos);
      if (vel.length() > 0.0001) {
        this.dummy.lookAt(pos.clone().add(vel));
      }
      // Swim tail wiggle (scale Z)
      const wiggle = Math.sin(this.swimTime[i]) * 0.15;
      this.dummy.rotation.y += wiggle;
      this.dummy.scale.setScalar(this.sp.scale * (0.85 + Math.random() * 0.3 * (i / this.size)));
      this.dummy.updateMatrix();
      this.mesh.setMatrixAt(i, this.dummy.matrix);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
  }
}

const schools = [];
fishSpecies.forEach((sp, si) => {
  const numSchools = Math.ceil(sp.count / sp.schoolSize);
  for (let s = 0; s < numSchools; s++) {
    schools.push(new FishSchool(si, s));
  }
});

// ─── PARTICLES (plankton) ────────────────────────────────────────────────────
const PLANKTON_COUNT = 400;
const planktonPositions = new Float32Array(PLANKTON_COUNT * 3);
for (let i = 0; i < PLANKTON_COUNT; i++) {
  planktonPositions[i*3]   = (Math.random()-0.5)*80;
  planktonPositions[i*3+1] = -18 + Math.random()*18;
  planktonPositions[i*3+2] = (Math.random()-0.5)*80;
}
const planktonGeo = new THREE.BufferGeometry();
planktonGeo.setAttribute('position', new THREE.BufferAttribute(planktonPositions, 3));
const planktonMat = new THREE.PointsMaterial({
  color: 0x88ffdd, size: 0.12, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false
});
scene.add(new THREE.Points(planktonGeo, planktonMat));

// ─── RESIZE ──────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── CLOCK & LOOP ────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let frameCount = 0;

renderer.setAnimationLoop(() => {
  const dt  = clock.getDelta();
  const t   = clock.getElapsedTime();
  frameCount++;

  // Update uniforms
  oceanMat.uniforms.time.value = t;
  floorMat.uniforms.time.value = t;
  skyMat.uniforms.time.value   = t;

  // God rays flicker
  godRays.forEach(r => { r.userData.mat.uniforms.time.value = t; });

  // Animated lights
  bluePL.position.set(Math.sin(t*0.3)*8, -3+Math.sin(t*0.5)*2, Math.cos(t*0.3)*8);
  causticLight.position.set(Math.cos(t*0.4)*12, 1+Math.sin(t*0.7)*1.5, Math.sin(t*0.4)*12);
  bluePL.intensity = 2.5 + Math.sin(t*1.2)*0.8;

  // Bubbles
  updateBubbles(t);

  // Fish
  schools.forEach(s => s.update(dt, t));

  // Controls
  if (!renderer.xr.isPresenting) controls.update();

  renderer.render(scene, camera);
});

// ─── HIDE LOADING ────────────────────────────────────────────────────────────
setTimeout(() => {
  const loading = document.getElementById('loading');
  loading.style.opacity = '0';
  setTimeout(() => loading.style.display = 'none', 1000);
}, 1200);
</script>
